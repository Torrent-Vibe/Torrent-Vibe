name: desktop-release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag (desktop-vX.Y.Z), must already exist"
        required: true
        type: string

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  SPARKLE_VERSION: "2.9.4"
  SPARKLE_TARBALL_SHA256: "ce89daf967db1e1893ed3ebd67575ed82d3902563e3191ca92aaec9164fbdef9"
  REPO_SLUG: "Torrent-Vibe/Torrent-Vibe"

jobs:
  release-mac:
    runs-on: macos-14
    # Notary queue can take longer than packaging; 90m covers sign + bounded
    # notary wait (20m default) + repackage.
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: version consistency check (tag vs root package.json)
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          case "$TAG" in
            desktop-v*) ;;
            *)
              echo "::error::tag $TAG does not match desktop-vX.Y.Z"
              exit 1
              ;;
          esac
          TAG_VERSION="${TAG#desktop-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $TAG (version $TAG_VERSION) does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: assert Sparkle secrets present (fail fast — an empty public key would be silently baked into the app)
        env:
          SPARKLE_ED_PUBLIC_KEY: ${{ secrets.SPARKLE_ED_PUBLIC_KEY }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PUBLIC_KEY" ] || [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_ED_PUBLIC_KEY / SPARKLE_ED_PRIVATE_KEY repo secrets are missing or empty"
            exit 1
          fi

      # Signing/notarization is opt-in by secrets. All five present → the
      # "enable Developer ID signing" step below drops `identity: null` from
      # electron-builder.yml and electron-builder signs with hardened runtime;
      # notarization + stapling then run as explicit steps after packaging
      # (builder's built-in notarize is pinned off — unbounded wait). None
      # present → ad-hoc signed exactly as before. A partial set is a config
      # error: Developer-ID-signed but unnotarized is still blocked by
      # Gatekeeper, so fail fast.
      - name: detect signing secrets (all 5 → sign + notarize, none → ad-hoc)
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then
              missing="$missing $v"
            fi
          done
          if [ -z "$missing" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Developer ID signing + notarization enabled"
          elif [ "$(echo "$missing" | wc -w)" -eq 5 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "no signing secrets configured — ad-hoc signed release"
          else
            echo "::error::partial signing secrets — missing:$missing. Configure all five (CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID) or none."
            exit 1
          fi

      - name: extract release notes from CHANGELOG (fail fast, before the build)
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if ! grep -q '[^[:space:]]' "$NOTES_FILE"; then
            echo "::error::no \"## $VERSION\" section found in CHANGELOG.md — add the section before tagging"
            exit 1
          fi
          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # only the content-addressable pnpm store is cached, never node_modules —
          # a cached node_modules can carry a stale @electron/rebuild meta entry
          # that lies about a native module already being built for Electron's ABI.
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: typecheck (main)
        run: pnpm typecheck:main

      - name: build native modules
        run: pnpm build:native

      - name: fetch Sparkle tools
        run: |
          curl -sSL -o /tmp/sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          echo "${SPARKLE_TARBALL_SHA256}  /tmp/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p /tmp/sparkle
          tar -xf /tmp/sparkle.tar.xz -C /tmp/sparkle bin/
          chmod +x /tmp/sparkle/bin/*
          echo "/tmp/sparkle/bin" >> "$GITHUB_PATH"

      - name: inject SUPublicEDKey into electron-builder.yml
        env:
          SPARKLE_ED_PUBLIC_KEY: ${{ secrets.SPARKLE_ED_PUBLIC_KEY }}
        run: |
          PLACEHOLDER="SPARKLE_ED_PUBLIC_KEY_PLACEHOLDER"
          if ! grep -q "$PLACEHOLDER" electron-builder.yml; then
            echo "::error::placeholder $PLACEHOLDER not found in electron-builder.yml — has the Sparkle bridge integration point moved?"
            exit 1
          fi
          sed -i '' "s|$PLACEHOLDER|$SPARKLE_ED_PUBLIC_KEY|" electron-builder.yml

      # identity: null hard-disables electron-builder signing. Deleting the line
      # restores default lookup: builder imports CSC_LINK p12 and signs with
      # hardened runtime. afterPack.cjs sees CSC_LINK and skips ad-hoc re-sign.
      - name: enable Developer ID signing (drop identity:null from electron-builder.yml)
        if: steps.signing.outputs.enabled == 'true'
        run: |
          grep -q '^  identity: null$' electron-builder.yml
          sed -i '' '/^  identity: null$/d' electron-builder.yml

      - name: compile + package desktop (dmg + zip arm64; Developer ID when secrets present, ad-hoc otherwise)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          pnpm electron:build
          pnpm exec electron-builder --mac dmg zip --arm64 --publish never

      - name: notarize + staple the .app (explicit notarytool, bounded wait)
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash .github/scripts/notarize-and-staple.sh "release/mac-arm64/Torrent Vibe.app"

      # dmg/zip from package embed the pre-staple app; rebuild both from the
      # stapled bundle. --prepackaged skips pack/sign; only re-runs dmg/zip.
      - name: repackage dmg + zip from the stapled app
        if: steps.signing.outputs.enabled == 'true'
        run: |
          rm -f release/*.dmg release/*.zip
          pnpm exec electron-builder --prepackaged release/mac-arm64 --mac dmg zip --arm64 --publish never

      - name: verify signature (dmg + zip both embed the already-signed app)
        env:
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
        run: |
          # Ad-hoc path: afterPack ad-hoc signs once before either target packs.
          # Developer ID path: builder signs during package, then notarize +
          # repackage staple and rebuild dmg/zip. Either way both artifacts
          # embed a valid CodeDirectory — this only confirms. generate_appcast
          # refuses any archive whose .app fails codesign --verify --deep --strict.
          verify_app() {
            codesign --verify --deep --strict "$1"
            if [ "$SIGNING_ENABLED" = "true" ]; then
              codesign --display --verbose=2 "$1" 2>&1 | grep -q 'Authority=Developer ID Application'
              xcrun stapler validate "$1"
              spctl --assess --type execute --verbose=2 "$1"
            fi
          }

          ZIP_PATH="$PWD/$(echo release/*.zip)"
          DMG_PATH="$PWD/$(echo release/*.dmg)"

          find_app() {
            find "$1" -name '*.app' -type d -print -quit
          }

          ZIP_EXTRACT_DIR="$(mktemp -d)"
          ditto -x -k "$ZIP_PATH" "$ZIP_EXTRACT_DIR"
          ZIP_APP="$(find_app "$ZIP_EXTRACT_DIR")"
          if [ -z "$ZIP_APP" ]; then
            echo "::error::no .app inside $ZIP_PATH"
            find "$ZIP_EXTRACT_DIR" -maxdepth 3
            exit 1
          fi
          verify_app "$ZIP_APP"
          rm -rf "$ZIP_EXTRACT_DIR"

          DMG_MOUNT_DIR="$(mktemp -d)"
          hdiutil attach "$DMG_PATH" -mountpoint "$DMG_MOUNT_DIR" -nobrowse -quiet
          DMG_APP="$(find_app "$DMG_MOUNT_DIR")"
          if [ -z "$DMG_APP" ]; then
            echo "::error::no .app inside $DMG_PATH"
            find "$DMG_MOUNT_DIR" -maxdepth 3
            hdiutil detach "$DMG_MOUNT_DIR" -quiet || true
            exit 1
          fi
          verify_app "$DMG_APP"
          hdiutil detach "$DMG_MOUNT_DIR" -quiet

      - name: prepare release archive dir
        id: archive
        run: |
          ARCHIVE_DIR="$RUNNER_TEMP/release-archive"
          mkdir -p "$ARCHIVE_DIR"
          # only the zip goes into ARCHIVE_DIR — that's the directory
          # generate_appcast scans, and an unsigned dmg would just be skipped
          # with a warning (or worse, confuse delta-base detection). The dmg
          # is uploaded to the release directly from release/.
          cp release/*.zip "$ARCHIVE_DIR/"
          # a .md with the same basename as the zip is how generate_appcast picks up
          # release notes; with --embed-release-notes below they land in the appcast
          # <description sparkle:format="markdown"> so the Sparkle dialog shows them.
          ZIP_BASE="$(basename release/*.zip .zip)"
          cp "${{ steps.notes.outputs.file }}" "$ARCHIVE_DIR/$ZIP_BASE.md"
          {
            echo "dir=$ARCHIVE_DIR"
            echo "dmg_path=$(echo release/*.dmg)"
            echo "zip_name=$(basename release/*.zip)"
          } >> "$GITHUB_OUTPUT"

      - name: fetch existing appcast + last 2 release archives (delta base)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # old zips are fetched into the same dir generate_appcast scans so it can
          # diff them for deltas, but they must NOT be re-uploaded as this release's
          # own assets — the publish step uploads only this release's own
          # dmg (dmg_path) and zip (zip_name), captured above, plus appcast.xml + *.delta.
          # $REPO_SLUG may also host non-desktop releases, so these queries filter
          # to desktop-v* tags explicitly rather than trusting "latest across the
          # whole repo" — an unrelated release published after a desktop one would
          # otherwise get picked as the delta base.
          ARCHIVE_DIR="${{ steps.archive.outputs.dir }}"
          LATEST_TAG="$(gh release list --repo "$REPO_SLUG" --exclude-drafts --limit 20 --json tagName \
            -q '[.[] | select(.tagName | startswith("desktop-v"))][0].tagName' 2>/dev/null || true)"
          if [ -n "$LATEST_TAG" ]; then
            gh release download --repo "$REPO_SLUG" --pattern 'appcast.xml' --dir "$ARCHIVE_DIR" "$LATEST_TAG" \
              || echo "no appcast.xml asset on latest release $LATEST_TAG"
          else
            echo "no previous release (first release) — generate_appcast will create a fresh appcast.xml"
          fi
          PREV_TAGS="$(gh release list --repo "$REPO_SLUG" --exclude-drafts --limit 20 --json tagName \
            -q '[.[] | select(.tagName | startswith("desktop-v"))][0:2][].tagName' 2>/dev/null || true)"
          for T in $PREV_TAGS; do
            gh release download --repo "$REPO_SLUG" --pattern '*.zip' --dir "$ARCHIVE_DIR" "$T" \
              || echo "no zip asset on release $T, skipping"
          done

      - name: sign + generate appcast (EdDSA key lives only on a RAM disk)
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          ARCHIVE_DIR="${{ steps.archive.outputs.dir }}"
          TAG="${{ steps.version.outputs.tag }}"

          DEV="$(hdiutil attach -nomount ram://16384 | awk '{print $1}')"
          diskutil erasevolume HFS+ SparkleKeyRAM "$DEV" >/dev/null
          KEY_DIR="/Volumes/SparkleKeyRAM"
          KEY_FILE="$KEY_DIR/ed_private_key"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$KEY_FILE"

          generate_appcast \
            --ed-key-file "$KEY_FILE" \
            --download-url-prefix "https://github.com/${REPO_SLUG}/releases/download/${TAG}/" \
            --embed-release-notes \
            --full-release-notes-url "https://github.com/${REPO_SLUG}/releases" \
            "$ARCHIVE_DIR"

          dd if=/dev/urandom of="$KEY_FILE" bs=1024 count=4 conv=notrunc 2>/dev/null
          rm -f "$KEY_FILE"
          hdiutil detach "$DEV"

      - name: rename delta files to GitHub-safe asset names
        run: |
          # generate_appcast names deltas after the .app bundle ("Torrent Vibe..."),
          # but GitHub replaces spaces in uploaded asset names with dots, so the
          # %20-encoded URL the appcast points at would 404 and every delta
          # download would silently fall back to the full zip.
          ARCHIVE_DIR="${{ steps.archive.outputs.dir }}"
          cd "$ARCHIVE_DIR"
          shopt -s nullglob
          for f in *.delta; do
            safe="${f// /.}"
            [ "$safe" = "$f" ] && continue
            mv "$f" "$safe"
            enc="${f// /%20}"
            sed -i '' "s|/$enc\"|/$safe\"|g" appcast.xml
            echo "renamed '$f' -> '$safe'"
          done

      - name: repoint old appcast enclosures at their own release tags
        run: node .github/scripts/fix-appcast-enclosure-urls.mjs "${{ steps.archive.outputs.dir }}/appcast.xml" "$REPO_SLUG"

      - name: publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          ARCHIVE_DIR="${{ steps.archive.outputs.dir }}"
          TAG="${{ steps.version.outputs.tag }}"
          ASSETS=(
            "${{ steps.archive.outputs.dmg_path }}"
            "$ARCHIVE_DIR/${{ steps.archive.outputs.zip_name }}"
            "$ARCHIVE_DIR/appcast.xml"
            "$ARCHIVE_DIR"/*.delta
          )
          # published immediately (no --draft): the app's Sparkle feed points at
          # releases/latest/download/appcast.xml, so publishing IS the rollout.
          gh release create "$TAG" \
            --repo "$REPO_SLUG" \
            --title "Torrent Vibe $TAG" \
            --notes-file "${{ steps.notes.outputs.file }}" \
            "${ASSETS[@]}"

  release-windows:
    runs-on: windows-latest
    needs: release-mac
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      # native/build-all.sh only builds the sparkle-bridge addon, whose build.sh
      # exits 0 on non-Darwin; the npm-dependency natives (sqlite3, bufferutil,
      # utf-8-validate) are rebuilt for Electron's ABI by electron-builder's
      # @electron/rebuild during packaging, so no build:native step is needed here.
      - name: compile + package desktop (NSIS x64)
        shell: bash
        run: |
          pnpm electron:build
          pnpm electron:make:win32

      - name: upload windows assets to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.release-mac.outputs.tag }}"
          gh release upload "$TAG" --repo "$REPO_SLUG" --clobber \
            release/*.exe \
            release/latest.yml \
            release/*.blockmap

  release-linux:
    runs-on: ubuntu-latest
    needs: release-mac
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      # native/build-all.sh only builds the sparkle-bridge addon (Darwin-only,
      # no-ops here); the npm-dependency natives are rebuilt for Electron's ABI
      # by electron-builder's @electron/rebuild during packaging.
      - name: compile + package desktop (AppImage x64)
        run: |
          pnpm electron:build
          pnpm electron:make:linux

      - name: upload linux assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.release-mac.outputs.tag }}"
          gh release upload "$TAG" --repo "$REPO_SLUG" --clobber \
            release/*.AppImage \
            release/latest-linux.yml

  release-helper:
    runs-on: ubuntu-latest
    needs: release-mac
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: apps/helper-go/go.sum

      - name: build linux binaries
        env:
          VERSION: ${{ needs.release-mac.outputs.version }}
        run: |
          cd apps/helper-go
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" \
            -o "torrent-vibe-helper_${VERSION}_linux_amd64" ./cmd/torrent-vibe-helper
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "-s -w" \
            -o "torrent-vibe-helper_${VERSION}_linux_arm64" ./cmd/torrent-vibe-helper
          sha256sum torrent-vibe-helper_${VERSION}_linux_* > SHA256SUMS-helper

      - name: upload helper assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-mac.outputs.version }}
        run: |
          TAG="${{ needs.release-mac.outputs.tag }}"
          gh release upload "$TAG" --repo "$REPO_SLUG" --clobber \
            "apps/helper-go/torrent-vibe-helper_${VERSION}_linux_amd64" \
            "apps/helper-go/torrent-vibe-helper_${VERSION}_linux_arm64" \
            apps/helper-go/SHA256SUMS-helper
